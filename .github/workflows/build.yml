name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    # Environment secrets (MACOS_CERTIFICATE etc.) live in the "release"
    # environment; without this declaration they are not visible here.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15          # arm64 runner; cross-compiles the x86_64 slice
            target: universal2
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      # --- macOS: both slices -> lipo -> ohmic.app -> sign -> notarize -> zip ---
      - name: Build (macOS)
        if: runner.os == 'Macos'
        shell: bash
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/ohmic \
            target/x86_64-apple-darwin/release/ohmic \
            -output ohmic

      - name: Import signing certificate (macOS)
        if: runner.os == 'Macos'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Falling back to ad-hoc keeps the workflow green when secrets are
          # not configured (e.g. workflow_dispatch test runs before setup).
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "MACOS_CERTIFICATE not set; will sign ad-hoc" >> "$GITHUB_ENV"
            echo "SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          CERT_PATH=$RUNNER_TEMP/cert.p12
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -t 3600 "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          test -n "$IDENTITY"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm "$CERT_PATH"

      - name: Package, sign, notarize (macOS)
        if: runner.os == 'Macos'
        shell: bash
        env:
          SIGN_IDENTITY: ${{ env.SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          APP=ohmic.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" \
            -c "Set :CFBundleVersion $VERSION" scripts/macos/Info.plist
          cp scripts/macos/Info.plist "$APP/Contents/Info.plist"
          cp scripts/macos/ohmic.icns "$APP/Contents/Resources/ohmic.icns"
          cp ohmic "$APP/Contents/MacOS/ohmic"
          codesign --force -s "$SIGN_IDENTITY" --options runtime --timestamp \
            "$APP"
          # Notarize only when real credentials are present; ad-hoc builds
          # (local test runs) just get stapled-less zip.
          if [ "$SIGN_IDENTITY" != "-" ] && [ -n "$APPLE_ID" ]; then
            ditto -c -k --keepParent "$APP" ohmic-notarize.zip
            xcrun notarytool submit ohmic-notarize.zip \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
            xcrun stapler staple "$APP"
            rm ohmic-notarize.zip
          fi
          zip -qry ohmic-macos-universal.zip "$APP"

      # --- Windows: exe -> zip (double-click to run, no installer needed) ---
      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked
          Compress-Archive -Path target/release/ohmic.exe -DestinationPath ohmic-windows-x86_64.zip

      # --- Linux: binary -> tar.gz ---
      - name: Build and package (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked
          tar -czf ohmic-linux-x86_64.tar.gz -C target/release ohmic

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}
          path: |
            *.zip
            *.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
